<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Recipes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff8f0;
      padding: 40px;
      text-align: center;
    }

    h1 {
      color: #ff914d;
    }

    .search-box {
      margin-top: 30px;
    }

    .search-input {
      padding: 12px 20px;
      width: 60%;
      max-width: 400px;
      font-size: 16px;
      border-radius: 25px;
      border: 1px solid #ccc;
      outline: none;
    }

    .search-btn {
      padding: 12px 16px;
      background-color: #ff914d;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin-left: 10px;
    }

    .search-btn:hover {
      background-color: #ff6a00;
    }

    a.back {
      display: inline-block;
      margin-top: 30px;
      color: #ff914d;
      text-decoration: none;
      font-weight: bold;
    }

    a.back:hover {
      text-decoration: underline;
    }
    .search-icon:link,
  .search-icon:visited,
  .search-icon:hover,
  .search-icon:active {
    color: white;
    text-decoration: none;
  }
  </style>
</head>
<body>
  <h1>Search Your Favorite Recipe 🍽️</h1>
  <div class="search-box">
    <input type="text" class="search-input" placeholder="Type to search...">
    <button class="search-btn" onclick="searchRecipe()">Search</button>

  </div>

  <a href="home.html" class="back">← Back to Home</a>
  <script>
  function searchRecipe() {
    const input = document.querySelector('.search-input').value.toLowerCase().trim();

    // Define available recipe pages
    const pages = {
      "burger": "burger.html",
      "milkshake": "milkshake.html",
      "pizza": "pizza.html",
      "pancake": "pancake.html",
      "bread omelette": "breadomelette.html",
      "waffle": "waffle.html",
      "grilled chicken":"grilledchicken.html",
      "chicken biryani":"chickenbiryani.html",
    };

    if (pages[input]) {
      window.location.href = pages[input];
    } else {
      alert("Recipe not found. Please try again.");
    }
  }
</script>

</body>
</html>
